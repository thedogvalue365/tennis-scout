name: Tennis Scout

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub a veces se retrasa unos minutos)
  workflow_dispatch:          # boton para lanzarlo a mano
    inputs:
      prueba:
        description: "Mandar mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tennis-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Buscar partidos nuevos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PINNACLE_API_KEY: ${{ secrets.PINNACLE_API_KEY }}
        run: |
          if [ "${{ inputs.prueba }}" = "true" ]; then python bot.py --test; fi
          python bot.py --once
      - name: Guardar memoria de partidos avisados
        if: always()
        run: |
          git config user.name "tennis-scout-bot"
          git config user.email "tennis-scout-bot@users.noreply.github.com"
          git add known_matches.json
          git diff --cached --quiet || (git commit -m "Actualizar partidos avisados" && git push)
